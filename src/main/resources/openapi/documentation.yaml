openapi: 3.1.1
info:
  title: Llamatik API
  description: |
    Self-hosted inference server exposing the same surface as the Llamatik `LlamaBridge`,
    `WhisperBridge`, `StableDiffusionBridge`, and `MultimodalBridge` APIs.

    - JSON endpoints for embeddings and generation
    - SSE streaming endpoints for token/delta streaming
    - Text-to-image and text-to-video generation (stable-diffusion.cpp)
    - Speech-to-text transcription (whisper.cpp)
    - Multimodal / VLM image analysis (streaming SSE)
  version: 2.2.0
servers:
  - url: http://localhost:8080/v1
    description: Local Llamatik Server instance

paths:

  # ── Server status ──────────────────────────────────────────────────────────

  /models:
    get:
      tags: [Status]
      summary: List currently loaded models
      description: |
        Returns the loaded state of every inference bridge.
        Only model filenames are returned — full server paths are never exposed.

        Each bridge reports `loaded: true/false` and, when loaded, the filename
        of the active model. The Stable Diffusion bridge also reports companion
        files (VAE, T5-XXL, CLIP vision). The multimodal bridge reports the
        projector filename alongside the model.

        This endpoint follows the same `REQUIRE_INFERENCE_AUTH` setting as all
        other inference endpoints.
      responses:
        '200':
          description: Snapshot of all bridge states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsStatusResponse'
              example:
                generation:
                  loaded: true
                  model: "llama-3.2-3b-instruct-q8_0.gguf"
                embedding:
                  loaded: false
                  model: null
                whisper:
                  loaded: true
                  model: "ggml-base-q8_0.bin"
                stableDiffusion:
                  loaded: false
                  model: null
                  vae: null
                  t5xxl: null
                  clipVision: null
                multimodal:
                  loaded: false
                  model: null
                  mmproj: null
                mtp:
                  loaded: false
                  model: null

  # ── Embeddings ─────────────────────────────────────────────────────────────

  /embeddings/init:
    post:
      tags: [Embeddings]
      summary: Initialize an embedding model
      description: |
        Loads a GGUF embedding model into memory. Must be called before `/embeddings/embed`.
        The model remains loaded until the server is restarted.

        **Startup alternative:** set the `EMBEDDING_MODEL_PATH` environment variable to load
        the model automatically at server start, without calling this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitModelRequest'
      responses:
        '200':
          description: Model initialization status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitModelResponse'
        '400':
          description: Init failed

  /embeddings/embed:
    post:
      tags: [Embeddings]
      summary: Compute an embedding vector for a given input string
      description: Requires a model loaded via `/embeddings/init` (or `EMBEDDING_MODEL_PATH` at startup).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          description: Embedding vector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '400':
          description: Embed failed

  # ── Generation ─────────────────────────────────────────────────────────────

  /generation/init:
    post:
      tags: [Generation]
      summary: Initialize a generation model
      description: |
        Loads a GGUF generation model into memory. Must be called before any generation,
        streaming, session, or model-metadata endpoint. Calling it again while a model is
        already loaded will replace the current model.

        **Startup alternative:** set the `GENERATION_MODEL_PATH` environment variable to load
        the model automatically at server start, without calling this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitModelRequest'
      responses:
        '200':
          description: Model initialization status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitModelResponse'
        '400':
          description: Init failed

  /generation/generate:
    post:
      tags: [Generation]
      summary: Generate a one-shot completion for a prompt
      description: Requires a model loaded via `/generation/init` (or `GENERATION_MODEL_PATH` at startup).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generated text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'

  /generation/generateWithContext:
    post:
      tags: [Generation]
      summary: Generate a completion given system prompt + context + user prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateWithContextRequest'
      responses:
        '200':
          description: Generated text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'

  /generation/generateJson:
    post:
      tags: [Generation]
      summary: Generate JSON (optionally constrained by a JSON schema)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateJsonRequest'
      responses:
        '200':
          description: Generated JSON as text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'

  /generation/generateJsonWithContext:
    post:
      tags: [Generation]
      summary: Generate JSON with system prompt + context + user prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateJsonWithContextRequest'
      responses:
        '200':
          description: Generated JSON as text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'

  /generation/continue:
    post:
      tags: [Generation]
      summary: Continue generation from the existing KV cache
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContinueRequest'
      responses:
        '200':
          description: Generated text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'

  /generation/stream:
    post:
      tags: [Generation]
      summary: Stream a completion as Server-Sent Events (SSE)
      description: Emits SSE events `delta`, then `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /generation/streamWithContext:
    post:
      tags: [Generation]
      summary: Stream a completion with context as Server-Sent Events (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateWithContextRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /generation/jsonStream:
    post:
      tags: [Generation]
      summary: Stream JSON generation as Server-Sent Events (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateJsonRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /generation/jsonStreamWithContext:
    post:
      tags: [Generation]
      summary: Stream JSON generation with context as Server-Sent Events (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateJsonWithContextRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /generation/continueStream:
    post:
      tags: [Generation]
      summary: Stream a continuation from the KV cache as Server-Sent Events (SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContinueRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /generation/params:
    post:
      tags: [Generation]
      summary: Update generation parameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParamsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /generation/cancel:
    post:
      tags: [Generation]
      summary: Cancel an in-progress generation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /generation/shutdown:
    post:
      tags: [Generation]
      summary: Unload the generation model and free native resources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /generation/session/reset:
    post:
      tags: [Generation - Session]
      summary: Clear the KV session state (keeps model loaded)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'

  /generation/session/save:
    post:
      tags: [Generation - Session]
      summary: Persist KV session state to disk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSaveRequest'
      responses:
        '200':
          description: Save status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'

  /generation/session/load:
    post:
      tags: [Generation - Session]
      summary: Restore KV session state from disk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLoadRequest'
      responses:
        '200':
          description: Load status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'

  /generation/model/finetuneType:
    get:
      tags: [Generation - Model Metadata]
      summary: Returns the `general.finetune` GGUF metadata field
      responses:
        '200':
          description: Fine-tune type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelFinetuneTypeResponse'

  /generation/model/chatTemplate:
    get:
      tags: [Generation - Model Metadata]
      summary: Returns the Jinja chat template embedded in the model
      responses:
        '200':
          description: Chat template string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelChatTemplateResponse'

  /generation/model/applyChatTemplate:
    post:
      tags: [Generation - Model Metadata]
      summary: Render messages into a prompt string using the model's built-in chat template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyChatTemplateRequest'
      responses:
        '200':
          description: Rendered prompt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyChatTemplateResponse'

  /generation/mtp/init:
    post:
      tags: [Generation - MTP]
      summary: Initialize a Multi-Token Prediction (MTP) speculative decoding head
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitMtpRequest'
      responses:
        '200':
          description: MTP init status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Init failed

  /generation/mtp/shutdown:
    post:
      tags: [Generation - MTP]
      summary: Release MTP speculative decoding resources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  # ── Whisper (STT) ──────────────────────────────────────────────────────────

  /whisper/init:
    post:
      tags: [Whisper]
      summary: Load a Whisper speech-to-text model
      description: |
        Loads a Whisper model into memory. Must be called before `/whisper/transcribe` or
        `/whisper/transcribeSegments`. Use `/whisper/release` to free resources when done.

        **Startup alternative:** set the `WHISPER_MODEL_PATH` environment variable to load
        the model automatically at server start, without calling this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhisperInitRequest'
      responses:
        '200':
          description: Init status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitModelResponse'
        '400':
          description: Init failed

  /whisper/transcribe:
    post:
      tags: [Whisper]
      summary: Transcribe a WAV file to flat text
      description: |
        Requires a model loaded via `/whisper/init` (or `WHISPER_MODEL_PATH` at startup).
        Provide a 16 kHz mono 16-bit PCM WAV for best results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscribeRequest'
      responses:
        '200':
          description: Transcribed text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResponse'
        '400':
          description: Transcription failed

  /whisper/transcribeSegments:
    post:
      tags: [Whisper]
      summary: Transcribe a WAV file with per-segment timestamps and optional diarization
      description: Requires a model loaded via `/whisper/init` (or `WHISPER_MODEL_PATH` at startup).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscribeSegmentsRequest'
      responses:
        '200':
          description: JSON document with segments, timestamps, and speaker turns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeSegmentsResponse'
        '400':
          description: Transcription failed

  /whisper/release:
    post:
      tags: [Whisper]
      summary: Free Whisper native resources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  # ── Stable Diffusion ───────────────────────────────────────────────────────

  /stablediffusion/init:
    post:
      tags: [Stable Diffusion]
      summary: Load a Stable Diffusion model
      description: |
        Loads a Stable Diffusion model into memory. Must be called before any image or video
        generation endpoint. Use `/stablediffusion/release` to free resources when done.

        For image-only models (SDXL, Flux, …) only `modelPath` and `threads` are required.
        Video models (Wan 2.1/2.2) additionally require `vaePath` and typically `t5xxlPath`.
        Pass `clipVisionPath` only for image-to-video variants.

        **Startup alternative:** set `SD_MODEL_PATH` (plus `SD_VAE_PATH`, `SD_T5XXL_PATH`,
        `SD_CLIP_VISION_PATH`, and `SD_THREADS` as needed) to load the model automatically
        at server start, without calling this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StableDiffusionInitRequest'
      responses:
        '200':
          description: Init status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitModelResponse'
        '400':
          description: Init failed

  /stablediffusion/txt2img:
    post:
      tags: [Stable Diffusion]
      summary: Generate an image from a text prompt
      description: |
        Requires a model loaded via `/stablediffusion/init` (or `SD_MODEL_PATH` at startup).
        Response contains Base64-encoded raw RGBA bytes (`width × height × 4`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Txt2ImgRequest'
      responses:
        '200':
          description: Generated image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          description: Generation failed
        '500':
          description: Generation produced no output

  /stablediffusion/img2img:
    post:
      tags: [Stable Diffusion]
      summary: Generate an image conditioned on an existing image and a prompt
      description: |
        Requires a model loaded via `/stablediffusion/init` (or `SD_MODEL_PATH` at startup).
        `initImageBase64` must be Base64-encoded raw RGBA bytes with dimensions `initImageW × initImageH × 4`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Img2ImgRequest'
      responses:
        '200':
          description: Generated image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          description: Generation failed
        '500':
          description: Generation produced no output

  /stablediffusion/supportsVideo:
    get:
      tags: [Stable Diffusion]
      summary: Check whether the loaded model supports video generation
      description: |
        Call this after `/stablediffusion/init`. Returns `true` for video-capable models
        (e.g. Wan 2.1/2.2). Standard image-only models return `false`.
      responses:
        '200':
          description: Video capability flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportsVideoResponse'
        '500':
          description: Check failed (no model loaded or internal error)

  /stablediffusion/txt2video:
    post:
      tags: [Stable Diffusion]
      summary: Generate a video from a text prompt
      description: |
        Requires a video-capable model loaded via `/stablediffusion/init` with companion files.
        The response contains the full packed frame buffer Base64-encoded.

        **Binary layout of the decoded `videoBase64` value:**
        ```
        [frameCount: Int32 LE][width: Int32 LE][height: Int32 LE][fps: Int32 LE]
        [frame_0_rgba: width * height * 4 bytes]
        [frame_1_rgba: width * height * 4 bytes]
        ...
        ```

        Returns HTTP 500 when the model produces no output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Txt2VideoRequest'
      responses:
        '200':
          description: Generated video (packed frames)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          description: Generation failed
        '500':
          description: Generation produced no output

  /stablediffusion/release:
    post:
      tags: [Stable Diffusion]
      summary: Free Stable Diffusion native resources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  # ── Multimodal (VLM) ────────────────────────────────────────────────────────

  /multimodal/init:
    post:
      tags: [Multimodal]
      summary: Load a VLM model and its multimodal projector
      description: |
        Loads a vision-language model and its companion multimodal projector (`mmprojPath`)
        into memory. Both paths are required. Must be called before `/multimodal/analyzeStream`.
        Use `/multimodal/release` to free resources when done.

        **Startup alternative:** set both `MULTIMODAL_MODEL_PATH` and `MULTIMODAL_MMPROJ_PATH`
        environment variables to load the model automatically at server start, without calling
        this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultimodalInitRequest'
      responses:
        '200':
          description: Init status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitModelResponse'
        '400':
          description: Init failed

  /multimodal/analyzeStream:
    post:
      tags: [Multimodal]
      summary: Analyze an image and stream the description as Server-Sent Events (SSE)
      description: |
        Requires a model loaded via `/multimodal/init` (or `MULTIMODAL_MODEL_PATH` + `MULTIMODAL_MMPROJ_PATH` at startup).
        `imageBase64` must be Base64-encoded JPEG, PNG, or BMP bytes.
        Uses the same SSE event format as generation streaming (`delta` / `done` / `error`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeImageRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /multimodal/cancel:
    post:
      tags: [Multimodal]
      summary: Cancel an in-progress image analysis
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

  /multimodal/release:
    post:
      tags: [Multimodal]
      summary: Free VLM native resources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'

components:
  schemas:

    # ── Shared ───────────────────────────────────────────────────────────────

    InitModelRequest:
      type: object
      required: [modelPath]
      properties:
        modelPath:
          type: string
          description: Absolute path to a GGUF/GGML model file on the server

    InitModelResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    # ── Embeddings ───────────────────────────────────────────────────────────

    EmbedRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string

    EmbedResponse:
      type: object
      required: [embedding]
      properties:
        embedding:
          type: array
          items:
            type: number
            format: float

    # ── Generation ───────────────────────────────────────────────────────────

    GenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string

    GenerateWithContextRequest:
      type: object
      required: [systemPrompt, contextBlock, userPrompt]
      properties:
        systemPrompt:
          type: string
        contextBlock:
          type: string
        userPrompt:
          type: string

    GenerateJsonRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        jsonSchema:
          type: string
          nullable: true

    GenerateJsonWithContextRequest:
      type: object
      required: [systemPrompt, contextBlock, userPrompt]
      properties:
        systemPrompt:
          type: string
        contextBlock:
          type: string
        userPrompt:
          type: string
        jsonSchema:
          type: string
          nullable: true

    GenerateContinueRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string

    GenerateResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string

    UpdateParamsRequest:
      type: object
      required: [temperature, maxTokens, topP, topK, repeatPenalty]
      properties:
        temperature:
          type: number
          format: float
        maxTokens:
          type: integer
        topP:
          type: number
          format: float
        topK:
          type: integer
        repeatPenalty:
          type: number
          format: float
        contextLength:
          type: integer
          default: 4096
        numThreads:
          type: integer
          default: 4
        useMmap:
          type: boolean
          default: true
        flashAttention:
          type: boolean
          default: false
        batchSize:
          type: integer
          default: 512
        gpuLayers:
          type: integer
          default: 0
          description: Number of model layers to offload to GPU. 0 = CPU only, -1 = all layers.

    SessionSaveRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string

    SessionLoadRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string

    SessionResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    ModelFinetuneTypeResponse:
      type: object
      properties:
        finetuneType:
          type: string
          nullable: true

    ModelChatTemplateResponse:
      type: object
      properties:
        chatTemplate:
          type: string
          nullable: true

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          example: user
        content:
          type: string

    ApplyChatTemplateRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        addAssistantPrefix:
          type: boolean
          default: true

    ApplyChatTemplateResponse:
      type: object
      properties:
        prompt:
          type: string
          nullable: true

    InitMtpRequest:
      type: object
      required: [modelPath]
      properties:
        modelPath:
          type: string
        draftLen:
          type: integer
          default: 3
          description: Maximum draft tokens per speculative step (1–8).

    # ── Whisper ──────────────────────────────────────────────────────────────

    WhisperInitRequest:
      type: object
      required: [modelPath]
      properties:
        modelPath:
          type: string

    TranscribeRequest:
      type: object
      required: [wavPath]
      properties:
        wavPath:
          type: string
        language:
          type: string
          nullable: true
          example: en
        initialPrompt:
          type: string
          nullable: true

    TranscribeResponse:
      type: object
      required: [text]
      properties:
        text:
          type: string

    TranscribeSegmentsRequest:
      type: object
      required: [wavPath]
      properties:
        wavPath:
          type: string
        language:
          type: string
          nullable: true
        initialPrompt:
          type: string
          nullable: true
        translate:
          type: boolean
          default: false
          description: When true, produces an English translation instead of a verbatim transcript.
        diarize:
          type: boolean
          default: false
          description: Enable speaker diarization (requires a -tdrz model).

    TranscribeSegmentsResponse:
      type: object
      required: [json]
      properties:
        json:
          type: string
          description: JSON document with per-segment text, start/end timestamps (ms), and speaker turn markers.

    # ── Stable Diffusion ─────────────────────────────────────────────────────

    StableDiffusionInitRequest:
      type: object
      required: [modelPath]
      properties:
        modelPath:
          type: string
          description: Path to the main model file (.gguf or .safetensors).
        threads:
          type: integer
          default: -1
          description: Number of CPU threads (-1 = auto).
        vaePath:
          type: string
          nullable: true
          description: Path to the VAE companion model. Required for video models (Wan 2.1/2.2).
        t5xxlPath:
          type: string
          nullable: true
          description: Path to the T5-XXL text encoder. Required for some video models.
        clipVisionPath:
          type: string
          nullable: true
          description: Path to the CLIP vision encoder. Required for image-to-video model variants.

    Txt2ImgRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        negativePrompt:
          type: string
          nullable: true
        width:
          type: integer
          default: 512
        height:
          type: integer
          default: 512
        steps:
          type: integer
          default: 20
        cfgScale:
          type: number
          format: float
          default: 7.0
        seed:
          type: integer
          format: int64
          default: -1

    Img2ImgRequest:
      type: object
      required: [initImageBase64, initImageW, initImageH, prompt]
      properties:
        initImageBase64:
          type: string
          description: Base64-encoded raw RGBA bytes of the source image (initImageW × initImageH × 4).
        initImageW:
          type: integer
        initImageH:
          type: integer
        prompt:
          type: string
        negativePrompt:
          type: string
          nullable: true
        width:
          type: integer
          default: 512
        height:
          type: integer
          default: 512
        steps:
          type: integer
          default: 20
        cfgScale:
          type: number
          format: float
          default: 7.0
        strength:
          type: number
          format: float
          default: 0.75
        seed:
          type: integer
          format: int64
          default: -1

    ImageResponse:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded raw RGBA bytes (width × height × 4).

    Txt2VideoRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        negativePrompt:
          type: string
          nullable: true
        width:
          type: integer
          default: 512
        height:
          type: integer
          default: 512
        videoFrames:
          type: integer
          default: 16
          description: Number of frames to generate.
        fps:
          type: integer
          default: 8
          description: Frames per second hint stored in the response header.
        cfgScale:
          type: number
          format: float
          default: 7.0
        seed:
          type: integer
          format: int64
          default: -1

    VideoResponse:
      type: object
      required: [videoBase64]
      properties:
        videoBase64:
          type: string
          description: |
            Base64-encoded packed frame buffer. After decoding, the binary layout is:
            `[frameCount: Int32 LE][width: Int32 LE][height: Int32 LE][fps: Int32 LE]`
            followed by `frameCount × width × height × 4` bytes of raw RGBA pixel data.

    SupportsVideoResponse:
      type: object
      required: [supportsVideo]
      properties:
        supportsVideo:
          type: boolean
          description: True when the currently loaded model supports txt2video generation.

    # ── Multimodal ───────────────────────────────────────────────────────────

    MultimodalInitRequest:
      type: object
      required: [modelPath, mmprojPath]
      properties:
        modelPath:
          type: string
        mmprojPath:
          type: string

    AnalyzeImageRequest:
      type: object
      required: [imageBase64, prompt]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded JPEG, PNG, or BMP bytes.
        prompt:
          type: string

    # ── Models status ─────────────────────────────────────────────────────────

    BridgeStatusDto:
      type: object
      required: [loaded]
      properties:
        loaded:
          type: boolean
        model:
          type: string
          nullable: true
          description: Filename of the loaded model, or null when no model is loaded.

    SdBridgeStatusDto:
      type: object
      required: [loaded]
      properties:
        loaded:
          type: boolean
        model:
          type: string
          nullable: true
        vae:
          type: string
          nullable: true
          description: Filename of the loaded VAE companion, or null.
        t5xxl:
          type: string
          nullable: true
          description: Filename of the loaded T5-XXL companion, or null.
        clipVision:
          type: string
          nullable: true
          description: Filename of the loaded CLIP vision companion, or null.

    MultimodalBridgeStatusDto:
      type: object
      required: [loaded]
      properties:
        loaded:
          type: boolean
        model:
          type: string
          nullable: true
        mmproj:
          type: string
          nullable: true
          description: Filename of the loaded multimodal projector, or null.

    ModelsStatusResponse:
      type: object
      required: [generation, embedding, whisper, stableDiffusion, multimodal, mtp]
      properties:
        generation:
          $ref: '#/components/schemas/BridgeStatusDto'
        embedding:
          $ref: '#/components/schemas/BridgeStatusDto'
        whisper:
          $ref: '#/components/schemas/BridgeStatusDto'
        stableDiffusion:
          $ref: '#/components/schemas/SdBridgeStatusDto'
        multimodal:
          $ref: '#/components/schemas/MultimodalBridgeStatusDto'
        mtp:
          $ref: '#/components/schemas/BridgeStatusDto'
